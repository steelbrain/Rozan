name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/development' }}
      - name: Check and build
        timeout-minutes: 25
        run: ./gradlew check assembleDebug assembleRelease --stacktrace
      - name: Budget checker tests
        timeout-minutes: 2
        run: python3 -m unittest discover -s scripts/perf
      - name: APK size budgets
        timeout-minutes: 2
        run: >-
          python3 scripts/perf/check-budgets.py
          --apk launcher=app/launcher/build/outputs/apk/release/launcher-release.apk
          --apk airplay=app/airplay/build/outputs/apk/release/airplay-release.apk
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: "**/build/reports/**"
          retention-days: 7
      - name: Upload APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apks
          path: app/*/build/outputs/apk/**/*.apk
          retention-days: 7

  instrumented:
    name: Instrumented tests (API ${{ matrix.api }})
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 31
            arch: x86
          - api: 36
            arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - name: Free disk space for the emulator
        # The AVD needs several GB free; the runner image ships toolchains we
        # never use. Without this the emulator exits at start with
        # "does not have enough disk space".
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/local/share/powershell /usr/local/lib/node_modules \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy
          df -h /
      - name: Enable KVM
        timeout-minutes: 2
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Limit Gradle memory
        # Private-repository runners have about 7 GB of RAM. With the project's 4 GB Gradle heap, a
        # Kotlin daemon beside it and the emulator, a run once took the whole runner down (no log,
        # cancelled at 60 minutes). The user-home properties override the project's.
        run: scripts/ci/limit-gradle-memory.sh
      - name: Build test APKs
        timeout-minutes: 15
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Stop the build daemon
        # Frees the build's heap before the emulator starts; the test run starts a small one again.
        run: ./gradlew --stop
      - name: Run on Android TV emulator
        timeout-minutes: 30
        env:
          API_LEVEL: ${{ matrix.api }}
          ABI: ${{ matrix.arch }}
        run: scripts/ci/emulator-tests.sh "$API_LEVEL" "$ABI"
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumented-reports-api${{ matrix.api }}
          path: |
            **/build/reports/androidTests/**
            ${{ runner.temp }}/emulator.log
          retention-days: 7

  memory:
    name: Memory budgets (API 36)
    # Its own runner and emulator: the memory scenarios measure PSS, so they should not share a
    # runner's RAM with the instrumented tests and their Gradle daemon.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/local/share/powershell /usr/local/lib/node_modules \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy
          df -h /
      - name: Enable KVM
        timeout-minutes: 2
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Limit Gradle memory
        run: scripts/ci/limit-gradle-memory.sh
      - name: Build the measurement APK
        timeout-minutes: 15
        run: ./gradlew :app:launcher:assembleBenchmarkRelease --stacktrace
      - name: Stop the build daemon
        run: ./gradlew --stop
      - name: Run the memory scenarios
        timeout-minutes: 20
        env:
          INSTRUMENTED_TESTS: "false"
          PERF_SCENARIOS_APK: app/launcher/build/outputs/apk/benchmarkRelease/launcher-benchmarkRelease.apk
          PERF_RESULTS: build/perf/results-api36.json
        run: scripts/ci/emulator-tests.sh 36 x86_64
      - name: Upload memory results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-results-api36
          path: build/perf/
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload emulator log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memory-emulator-log
          path: ${{ runner.temp }}/emulator.log
          retention-days: 7

  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        timeout-minutes: 3
        run: scripts/ci/actionlint.sh
      - name: zizmor
        timeout-minutes: 5
        run: pipx run --spec "zizmor==${ZIZMOR_VERSION}" zizmor --persona=pedantic .github/workflows
        env:
          ZIZMOR_VERSION: "1.32.0"
