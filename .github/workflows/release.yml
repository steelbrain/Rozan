name: Release

# Push a tag `vX.Y.Z` (matching `rozan.version` in gradle.properties) to build,
# sign and publish both APKs as a GitHub release. See docs/RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag matches rozan.version
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/release/check-version.sh "$TAG"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Release builds never read or write the shared build cache.
          cache-disabled: true
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ROZAN_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The ROZAN_KEYSTORE_BASE64 secret is not set. See docs/RELEASING.md."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ROZAN_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Check and build release APKs
        timeout-minutes: 25
        env:
          ROZAN_REQUIRE_RELEASE_SIGNING: "true"
          ROZAN_KEYSTORE_PASSWORD: ${{ secrets.ROZAN_KEYSTORE_PASSWORD }}
          ROZAN_KEY_ALIAS: ${{ secrets.ROZAN_KEY_ALIAS }}
          ROZAN_KEY_PASSWORD: ${{ secrets.ROZAN_KEY_PASSWORD }}
        run: ./gradlew check assembleRelease --stacktrace --no-build-cache
      - name: Collect APKs, checksums and notes
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/release/collect.sh "$TAG" dist
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Publish GitHub release
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: scripts/release/publish.sh "$TAG" dist
